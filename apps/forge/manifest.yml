modules:
  jira:issuePanel:
    - key: forksafe-issue-panel
      resource: panel
      resolver:
        function: resolver
      render: native
      title: ForkSafe investigation
      icon: resource:static;forksafe.svg
  jira:issueAction:
    - key: forksafe-start-investigation
      resource: start
      resolver:
        function: resolver
      render: native
      title: Start ForkSafe investigation
  webtrigger:
    - key: forksafe-selfcheck
      function: selfcheck
  function:
    - key: resolver
      handler: generated/resolver.handler
    - key: selfcheck
      handler: generated/resolver.selfcheck
resources:
  - key: panel
    path: src/frontend/panel.tsx
  - key: start
    path: src/frontend/start.tsx
  - key: static
    path: static
remotes:
  - key: forksafe-backend
    baseUrl: https://giant-jellyfish-684.convex.site
    operations:
      - compute
      - storage
    storage:
      inScopeEUD: false
permissions:
  scopes:
    - read:jira-work
app:
  id: ari:cloud:ecosystem::app/66bb7292-9ddc-4529-aa0f-db7b15fc667a
  runtime:
    name: nodejs22.x
