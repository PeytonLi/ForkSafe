[project]
name = "forksafe-python"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mujoco>=3.17,<3.18",
  "numpy>=2.2,<3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.28",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["services", "controllers", "tests"]
pythonpath = ["services"]
